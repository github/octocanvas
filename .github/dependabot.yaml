version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github_actions'
    groups:
      actions-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
    cooldown:
      default-days: 7
